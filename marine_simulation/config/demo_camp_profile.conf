; The fixed part of the settings CAMP starts from in the demo (QSettings INI).
;
; The demo manager (demo_camp_launch.py) reads this file, adds the map view (from demo_camp_view.yaml) and
; one switched-on live coverage layer per boat (from the roster), and writes the
; result where CAMP reads its settings, on every start. CAMP is given its own
; settings directory (XDG_CONFIG_HOME), so the operator's own CAMP settings are
; neither read nor changed.
;
; Only what is written here or generated is restored: no chart lists, no vector or
; raster layers, no window geometry. [MainWindow] and [MapView] are generated and
; must not appear in this file.
;
; [LiveCoverageLayer] is not a CAMP section: demo_support.build_profile removes it and writes
; these keys into the MapItem group of every boat's live coverage layer (the keys CAMP reads in
; SonarLiveCacheLayer::readSettings; the palette names are marine_colormap's registry).
;
; Range. The live layer colours the "depth" band of the tiles as it comes, and that band is the
; seabed's WGS84 ellipsoid height in metres, positive up (cube_bathymetry README, "The grid
; elevation convention"), not a depth: at Portsmouth it is about -46 m over 17 m of water (read
; from the live tile cache of a demo run, 2026-10-20: the water surface is at about -29.4 m
; there, mean of tile + chart depth over 407 cells, standard deviation 0.6 m). A fixed range of
; 0 to 30 m of depth, the range the Ping Profile uses, is therefore -29.4 (surface) down to
; -59.4 m: range_min is the deep end, range_max the shallow end. This is the Portsmouth demo
; site only; elsewhere the surface height differs by the geoid separation.
;
; Colormap: viridis. Colour runs from range_min to range_max, so deep is the dark end and
; shallow the light yellow end, the hydrographic habit of shallow = light and warm. It is
; perceptually uniform with a monotonic luminance ramp (what a map that carries
; ordered values needs), spans several hues so neighbouring depths can be told
; apart, and holds up under common colour-vision deficiencies. Not turbo or thermal (luminance
; is not monotonic), not grayscale or bronze (one hue), not oleron or hypsometric (built around
; a shoreline at a fixed elevation).

[LiveCoverageLayer]
colormap=viridis
range_mode=manual
range_min=-59.4
range_max=-29.4

[BackgroundTileLayers]
ids=openstreetmap
openstreetmap\refresh_ms=0
openstreetmap\type=xyz
openstreetmap\url=https://tile.openstreetmap.org/
seeded=true

[MapItem]
CAMP\Layers\openstreetmap\opacity=1
CAMP\Layers\openstreetmap\visible=true
openstreetmap\opacity=1
openstreetmap\visible=true
