# Where CAMP's map starts in the demo, the FIRST time only: once CAMP has been closed it saves
# its own window and map view and the next start restores those (start with --camp-fresh to
# throw them away); this file and the fit below only apply while nothing is saved.
#
# By default (nothing set here) the view is FITTED to the target survey area: the middle of
# the polygon's bounding box, at the scale that shows all of it with a margin on every side,
# in the window the layout file gives CAMP (its rect, or the monitor it is maximised or full
# screen on, read with xrandr; 1920x1080 when that cannot be read, which is the case now that the
# shipped layout places no CAMP window). The target is the same
# file CAMP opens and the publisher sends to the scorer (--target, else the shipped polygon),
# so a new polygon needs no change here.
#
# To override it, give a scale, and optionally a centre; the values are then used exactly as
# written. scale is CAMP's own number: screen pixels per map unit, where a map unit is one
# Web Mercator metre (about 0.73 ground metres at Portsmouth). 1.0 puts roughly 2.6 km of
# harbour across a 3840 pixel wide map. To find a value: run CAMP, zoom to taste, and read
# MainWindow/mapScale and MainWindow/mapCenter from CAMP's settings file after closing it.
# Without lat and lon the centre is the middle of the boats' start positions.
camp_view: {}
#  scale: 1.0
#  lat: 43.0743
#  lon: -70.7105
