# Node parameters shared by every demo boat (demo_boats_launch.py loads this once).
#
# Only prefix-independent values live here, so the keys use the node-wildcard form
# the other configs use. Everything that depends on the boat name (frame names,
# platform colour, joystick device) is set per boat by the launch from
# demo_roster.yaml and demo_joysticks.yaml.

# helm_manager: pass the manual (joystick) helm through to asv_helm, and start in
# manual so the first stick movement drives the boat. Nothing changes the mode unless
# something publishes on <boat>/piloting_mode (the self-test and a hand-sent mission do; the
# pad's mode buttons go to marine/send_command and there is no command_bridge to receive them).
/**/helm_manager:
  ros__parameters:
    output_type: helm
    initial_piloting_mode: manual
    max_yaw_speed: 0.5
    max_speed: 2.75

# joy_to_helm: stated explicitly rather than relying on the node defaults. These are
# the xpad (Xbox layout, "XInput mode") axes as reported by joy_linux:
#   axes:    0 left X, 1 left Y, 2 left trigger, 3 right X, 4 right Y,
#            5 right trigger, 6 d-pad X, 7 d-pad Y   (8 axes)
#   buttons: 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 back, 7 start, 8 guide,
#            9 left stick click, 10 right stick click   (11 buttons)
# joy_to_helm reads buttons[9] and buttons[10] on every message and ignores the
# whole message if the pad reports fewer than 11 buttons.
# Throttle = left stick up, rudder = right stick; throttle is scaled to 35 % unless
# the left trigger (axis 2) is pulled below zero, which gives full speed.
/**/joy_to_helm:
  ros__parameters:
    throttle_axis: 1
    slow_mode_axis: 2
    rudder_axis: 3
    manual_button: 0
    standby_button: 1
    autonomous_button: 2

# mru_transform: the single simulated nav source asv_sim publishes under sensors/nav.
/**/mru_transform:
  ros__parameters:
    sensors:
      nav:
        topics:
          orientation: "sensors/nav/orientation"
          position: "sensors/nav/position"
          velocity: "sensors/nav/velocity"
    sensor_names:
      - nav

# platform_sender: what CAMP draws for each boat. Size and reference point are the
# ben_project11 values (Ben's footprint); the colour is set per boat by the launch.
/**/platform_sender:
  ros__parameters:
    width: 1.7
    length: 4.25
    reference_x: 0.525
    nav:
      source_names:
        - nav
      sources:
        nav:
          topics:
            orientation: "sensors/nav/orientation"
            position: "sensors/nav/position"
            velocity: "sensors/nav/velocity"

# cube_bathymetry: no draft_dir and no prior_store_dir, for every boat. The CUBE grid
# is persisted to and reloaded from disk only when these are set. The between-rounds
# reset is a lifecycle cleanup/configure cycle (it empties the grid) and starts from
# nothing only if nothing is reloaded. Both default to empty; they are stated here so a
# reader sees the requirement. Do NOT layer bizzyboat.yaml or any other config that
# sets them. (An empty string cannot be passed as a -p command line override, so this
# is a parameter file rather than a SetParameter.)
/**/cube_bathymetry:
  ros__parameters:
    draft_dir: ""
    prior_store_dir: ""

# demo_watchdog: who drives a boat. The pad's while somebody touches it; when nobody has for
# idle_timeout seconds, or there is no pad (missing_pad_grace seconds after start), the boat
# surveys its section of the target area by itself, and the first touch of the pad hands it back.
# Activity is a button or an axis farther than activity_threshold from the pad's rest, or an axis
# that moved more than that since the last message (joy_linux repeats an untouched pad at
# 10 Hz, so message times say nothing). The lines are line_spacing metres apart (about the
# 120 degree sonar's swath at 16 m, less the overlap, would be 90 m), edge_margin shorter at both
# ends of a line, driven at survey_speed_knots (below the boat's 2.75 m/s top speed);
# line_heading_deg NaN means along the long side of the area. A finished section repeats after
# repeat_delay seconds (on_complete: hold stays), or failed_repeat_delay seconds when every
# line of it failed. section_index/section_count, boat and
# map_frame come from the launch (the boats that run, in roster order).
/**/demo_watchdog:
  ros__parameters:
    idle_timeout: 30.0
    missing_pad_grace: 10.0
    pad_lost_timeout: 3.0
    activity_threshold: 0.05
    line_spacing: 80.0
    edge_margin: 15.0
    min_line_length: 30.0
    survey_speed_knots: 4.0
    on_complete: repeat
    repeat_delay: 10.0
    failed_repeat_delay: 120.0
