# Where the demo's windows go on one machine (read by scripts/place_windows.py).
#
# Copy this file, edit it for the host, and give the copy to the launch with
# layout_config:=<file> (run_demo.sh picks up ~/.config/marine_simulation_demo/layout.yaml).
# Monitor names are the ones `xrandr --listmonitors` prints in its last column.
# Placement needs an X11 session ("GNOME on Xorg"), the wmctrl package and, for a maximized
# window, xprop and xrandr (package x11-utils / x11-xserver-utils, normally installed).

# How long to wait for the windows to appear, in seconds (default 90).
timeout_seconds: 90

# CAMP is deliberately NOT placed. It saves its own window (size, position, maximised or not)
# and map view when it closes and restores them the next time, so the operator maximises it once
# with the title bar button and it comes back the same; a resize from here would only fight
# that (and move the map under the fitted/saved view). The first start on a new computer: start
# the demo, maximise CAMP, set the view, close CAMP (which stops the demo), start again. To
# forget what CAMP saved, start with --camp-fresh.
#
# What this file is for: the windows CAMP does not remember. Mechanism notes for an entry:
# `maximized: true` keeps the title bar and is verified by its window-manager state (maximised,
# not full screen, read with xprop), not by size alone; `fullscreen: true` covers the monitor
# with no title bar; a `rect` puts a window at a given place.
windows: []

# The second display is reserved for the scoreboard (not built yet), so nothing
# is placed there now. When it exists, replace `windows: []` above with an entry for it:
#
# windows:
#   - name: scoreboard
#     match: {title: Scoreboard}
#     monitor: DP-2
#     fullscreen: true
#
# or, to put a window in a corner of one display (a laptop, say), a rectangle measured in
# pixels from the monitor's top left corner:
#
#   - name: scoreboard
#     match: {title: Scoreboard}
#     monitor: eDP-1
#     rect: {x: 0, y: 0, width: 1600, height: 900}
